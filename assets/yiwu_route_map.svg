<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">义乌两日购物路线示意图</title>
  <desc id="desc">从义乌站到国际商贸城、篁园服装市场、宾王夜市、鸡鸣阁与异国美食街的路线关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.52" stop-color="#f4fbf8"/>
      <stop offset="1" stop-color="#fff3f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2c3135" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <path d="M150 225 C330 120 440 170 575 255 S835 335 1010 210" fill="none" stroke="#f2ad4e" stroke-width="16" stroke-linecap="round" opacity=".88"/>
  <path d="M250 485 C430 375 560 405 690 495 S900 620 1080 500" fill="none" stroke="#4c9a8a" stroke-width="16" stroke-linecap="round" opacity=".84"/>
  <path d="M355 210 C410 330 410 445 350 565" fill="none" stroke="#e36f5f" stroke-width="10" stroke-dasharray="18 18" stroke-linecap="round"/>
  <path d="M775 250 C795 380 755 485 665 570" fill="none" stroke="#5778a4" stroke-width="10" stroke-dasharray="18 18" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="86" y="86" font-size="42" font-weight="800" fill="#24302f">义乌购物旅行路线</text>
    <text x="88" y="126" font-size="20" fill="#66736e">Day 1 批发市场精逛 + 夜市；Day 2 零售淘货 + 美食拍照</text>
    <g filter="url(#shadow)">
      <g transform="translate(92 176)">
        <rect width="205" height="96" rx="18" fill="#fff"/>
        <circle cx="44" cy="48" r="24" fill="#f2ad4e"/>
        <text x="82" y="43" font-size="24" font-weight="800" fill="#25302e">义乌站</text>
        <text x="82" y="72" font-size="16" fill="#69736f">南广场11号站台</text>
      </g>
      <g transform="translate(330 238)">
        <rect width="280" height="112" rx="20" fill="#fff"/>
        <circle cx="50" cy="56" r="27" fill="#e36f5f"/>
        <text x="92" y="50" font-size="25" font-weight="800" fill="#25302e">国际商贸城一区</text>
        <text x="92" y="82" font-size="16" fill="#69736f">饰品、玩具、仿真花</text>
      </g>
      <g transform="translate(660 275)">
        <rect width="300" height="112" rx="20" fill="#fff"/>
        <circle cx="50" cy="56" r="27" fill="#5778a4"/>
        <text x="92" y="50" font-size="25" font-weight="800" fill="#25302e">国际商贸城四区</text>
        <text x="92" y="82" font-size="16" fill="#69736f">包包、帽子、穿搭小物</text>
      </g>
      <g transform="translate(970 156)">
        <rect width="220" height="100" rx="18" fill="#fff"/>
        <circle cx="45" cy="50" r="24" fill="#4c9a8a"/>
        <text x="82" y="46" font-size="24" font-weight="800" fill="#25302e">兴中小区</text>
        <text x="82" y="74" font-size="16" fill="#69736f">手串、散珠零售</text>
      </g>
      <g transform="translate(110 515)">
        <rect width="250" height="104" rx="18" fill="#fff"/>
        <circle cx="46" cy="52" r="25" fill="#4c9a8a"/>
        <text x="86" y="47" font-size="24" font-weight="800" fill="#25302e">篁园服装市场</text>
        <text x="86" y="77" font-size="16" fill="#69736f">单件衣服更友好</text>
      </g>
      <g transform="translate(510 535)">
        <rect width="230" height="104" rx="18" fill="#fff"/>
        <circle cx="46" cy="52" r="25" fill="#f2ad4e"/>
        <text x="86" y="47" font-size="24" font-weight="800" fill="#25302e">宾王夜市</text>
        <text x="86" y="77" font-size="16" fill="#69736f">18:00后氛围最好</text>
      </g>
      <g transform="translate(822 562)">
        <rect width="210" height="104" rx="18" fill="#fff"/>
        <circle cx="46" cy="52" r="25" fill="#e36f5f"/>
        <text x="86" y="47" font-size="24" font-weight="800" fill="#25302e">鸡鸣阁</text>
        <text x="86" y="77" font-size="16" fill="#69736f">亮灯后拍夜景</text>
      </g>
      <g transform="translate(1010 420)">
        <rect width="220" height="108" rx="18" fill="#fff"/>
        <circle cx="46" cy="54" r="25" fill="#5778a4"/>
        <text x="86" y="46" font-size="24" font-weight="800" fill="#25302e">异国美食街</text>
        <text x="86" y="76" font-size="16" fill="#69736f">土耳其/阿富汗/印度</text>
      </g>
    </g>
    <g transform="translate(88 680)">
      <rect width="1100" height="38" rx="19" fill="#ffffff" opacity=".78"/>
      <text x="24" y="25" font-size="16" fill="#66736e">交通建议：义乌站到商贸城优先市场专线/公交；商贸城内部按区走，不要一天硬逛五区。</text>
    </g>
  </g>
</svg>
